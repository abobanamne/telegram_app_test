
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>My Telegram Mini App</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #222222);
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      text-align: center;
    }

    .score {
      font-size: 24px;
      font-weight: bold;
      margin: 24px 0;
    }

    .image-button {
      display: block;
      width: 100%;
      padding: 0;
      border: 0;
      border-radius: 20px;
      overflow: hidden;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.12s ease;
    }

    .image-button img {
      display: block;
      width: 100%;
      height: auto;
    }

    .image-button:active {
      transform: scale(0.96);
    }

    .hint {
      opacity: 0.7;
      font-size: 14px;
    }

    #status {
      min-height: 24px;
      margin-top: 18px;
    }
  </style>
</head>

<body>
  <main class="container">
    <h2>🎁 Бонусная кнопка</h2>

    <p>Нажми на изображение, чтобы получить очки!</p>

    <div class="score">
      ⭐ Очки: <span id="score">0</span>
    </div>

    <button
      class="image-button"
      id="bonusButton"
      type="button"
      aria-label="Получить 1 очко"
    >
      <img
        src="./images/bonus.png"
        alt="Нажми, чтобы получить бонус"
      >
    </button>

    <p class="hint">Нажимай на картинку 👆</p>

    <p id="status" aria-live="polite">
      Ты готов? 🚀
    </p>
  </main>

  <script>
    const tg = window.Telegram?.WebApp;

    if (tg) {
      tg.ready();
      tg.expand();
    }

    let score = 0;

    const scoreElement = document.getElementById("score");
    const statusElement = document.getElementById("status");
    const bonusButton = document.getElementById("bonusButton");

    bonusButton.addEventListener("click", () => {
      // Выполняем действие
      score += 1;

      // Обновляем интерфейс
      scoreElement.textContent = score;
      statusElement.textContent = "🎉 Ты получил 1 очко!";

      // Виброотклик в Telegram, если доступен
      tg?.HapticFeedback?.impactOccurred("medium");
    });
  </script>
</body>
</html>
