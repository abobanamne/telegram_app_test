
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Doxb1t</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 18px;
      font-family: Arial, sans-serif;
      background: var(--tg-theme-bg-color, #fff);
      color: var(--tg-theme-text-color, #222);
    }

    .app {
      max-width: 420px;
      margin: auto;
      text-align: center;
    }

    .main-button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      background: var(--tg-theme-button-color, #2787e8);
      color: var(--tg-theme-button-text-color, white);
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .menu {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .menu[hidden] {
      display: none;
    }

    .option-button {
      padding: 14px 8px;
      border: 1px solid var(--tg-theme-hint-color, #ddd);
      border-radius: 12px;
      background: var(--tg-theme-secondary-bg-color, #f1f1f1);
      color: var(--tg-theme-text-color, #222);
      font-size: 14px;
      cursor: pointer;
    }

    .option-button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .status {
      margin: 18px 0;
      font-size: 14px;
      color: var(--tg-theme-hint-color, #777);
    }

    .image-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 20px;
    }

    .image-slot {
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border-radius: 14px;
      background: var(--tg-theme-secondary-bg-color, #f1f1f1);
      border: 1px dashed var(--tg-theme-hint-color, #bbb);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .image-slot img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .empty-slot {
      font-size: 13px;
      color: var(--tg-theme-hint-color, #888);
    }
  </style>
</head>

<body>
  <main class="app">

    <h2>Мои домики</h2>

    <button
      id="mainButton"
      class="main-button"
      type="button"
      aria-expanded="false"
    >
      ＋ Открыть меню домиков
    </button>

    <div id="menu" class="menu" hidden>
      <button class="option-button" data-add="1">
        Добавить №1
      </button>

      <button class="option-button" data-add="2">
        Добавить №2
      </button>
    </div>

    <p id="status" class="status" aria-live="polite">
      Добавлено домиков: 0 из 4
    </p>

    <div id="imageGrid" class="image-grid">
      <div class="image-slot"><span class="empty-slot">Пусто</span></div>
      <div class="image-slot"><span class="empty-slot">Пусто</span></div>
      <div class="image-slot"><span class="empty-slot">Пусто</span></div>
      <div class="image-slot"><span class="empty-slot">Пусто</span></div>
    </div>

  </main>

  <script>
    const tg = window.Telegram?.WebApp;

    tg?.ready();
    tg?.expand();

    const mainButton = document.getElementById("mainButton");
    const menu = document.getElementById("menu");
    const status = document.getElementById("status");
    const slots = [
      ...document.querySelectorAll(".image-slot")
    ];
    const optionButtons = [
      ...document.querySelectorAll("[data-add]")
    ];

    const MAX_IMAGES = 4;
    const imagePath = "./images/bonus.png";

    let imagesAdded = 0;

    // Открыть или закрыть две кнопки
    mainButton.addEventListener("click", () => {
      menu.hidden = !menu.hidden;

      mainButton.setAttribute(
        "aria-expanded",
        String(!menu.hidden)
      );

      mainButton.textContent = menu.hidden
        ? "＋ Открыть меню"
        : "− Скрыть меню";
    });

    // Добавление одинаковых картинок
    optionButtons.forEach((button) => {
      button.addEventListener("click", () => {
        if (imagesAdded >= MAX_IMAGES) {
          status.textContent = "Достигнут лимит: 4 домика.";
          return;
        }

        const slot = slots[imagesAdded];
        const img = document.createElement("img");

        img.src = imagePath;
        img.alt = "Элемент коллекции";

        img.onerror = () => {
          img.remove();
          slot.innerHTML =
            '<span class="empty-slot">Ошибка загрузки</span>';
        };

        slot.replaceChildren(img);
        imagesAdded++;

        status.textContent =
          `Добавлено домиков: ${imagesAdded} из ${MAX_IMAGES}`;

        // Блокируем добавление после достижения лимита
        if (imagesAdded >= MAX_IMAGES) {
          optionButtons.forEach((item) => {
            item.disabled = true;
          });

          status.textContent =
            "Коллекция домиков заполнена: 4 из 4";
        }

        tg?.HapticFeedback?.impactOccurred("light");
      });
    });
  </script>
</body>
</html>
