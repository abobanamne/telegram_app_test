
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>My Mini App</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #222222);
    }

    .card {
      padding: 24px;
      border-radius: 20px;
      background: var(--tg-theme-secondary-bg-color, #f2f2f2);
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 20px;
      border: 0;
      border-radius: 12px;
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2 id="greeting">Привет!</h2>
    <p>Это моё первое Telegram Mini App.</p>
    <p id="status">Приложение готово к запуску.</p>
    <button id="action">Нажми меня</button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;

    if (tg) {
      tg.ready();
      tg.expand();

      const user = tg.initDataUnsafe?.user;

      if (user?.first_name) {
        document.getElementById("greeting").textContent =
          `Привет, ${user.first_name}!`;
      }
    }

    document.getElementById("action").onclick = () => {
      document.getElementById("status").textContent =
        "Отлично! Кнопка работает 🚀";

      tg?.HapticFeedback?.impactOccurred("light");
    };
  </script>
</body>
</html>
