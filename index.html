
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Doxb1t</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 22px 16px;
      font-family: Arial, sans-serif;
      background: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #222222);
    }

    .app {
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
    }

    h2 {
      margin: 0 0 20px;
      text-align: center;
      font-size: 23px;
    }

    /* Шесть кнопок */
    .buttons {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .fly-button {
      min-width: 0;
      min-height: 54px;
      padding: 10px 4px;
      border: none;
      border-radius: 13px;
      background: var(--tg-theme-button-color, #3287d8);
      color: var(--tg-theme-button-text-color, #ffffff);
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .fly-button:active {
      filter: brightness(0.9);
    }

    /* Статус */
    .status {
      margin: 18px 0;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
      color: var(--tg-theme-hint-color, #777777);
    }

    /* Сетка картинок */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .cell {
      min-width: 0;
    }

    .picture-box {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border-radius: 15px;
      background: var(--tg-theme-secondary-bg-color, #f0f0f0);
      border: 1px solid var(--tg-theme-section-separator-color, #dddddd);
    }

    .picture-box img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .caption {
      margin-top: 9px;
      text-align: center;
      font-size: 15px;
      font-weight: bold;
    }

    /* Летящая копия кнопки */
    .flying {
      position: fixed !important;
      z-index: 9999;
      margin: 0 !important;
      pointer-events: none !important;
      transform: none !important;
      transition:
        left 0.55s cubic-bezier(.2, .8, .2, 1),
        top 0.55s cubic-bezier(.2, .8, .2, 1),
        width 0.55s ease,
        height 0.55s ease,
        opacity 0.55s ease,
        border-radius 0.55s ease;
      will-change: left, top, width, height;
    }

    @media (prefers-reduced-motion: reduce) {
      .flying {
        transition-duration: 0.01ms;
      }
    }
  </style>
</head>

<body>
  <main class="app">

    <h2>Моя задачи</h2>

    <!-- Шесть постоянно работающих кнопок -->
    <div class="buttons" id="buttons">
      <button class="fly-button" type="button">Задача 1</button>
      <button class="fly-button" type="button">Задача  2</button>
      <button class="fly-button" type="button">Задача  3</button>
      <button class="fly-button" type="button">Задача  4</button>
      <button class="fly-button" type="button">Задача  5</button>
      <button class="fly-button" type="button">Задача  6</button>
    </div>

    <p class="status" id="status" aria-live="polite">
      Нажми на любую кнопку!
    </p>

    <!-- Четыре постоянно видимые картинки -->
    <div class="grid" id="grid">

      <div class="cell">
        <div class="picture-box" data-slot="0">
          <img src="./images/bonus.png" alt="Первый">
        </div>
        <div class="caption">Первый домик</div>
      </div>

      <div class="cell">
        <div class="picture-box" data-slot="1">
          <img src="./images/bonus.png" alt="Второй">
        </div>
        <div class="caption">Второй домик</div>
      </div>

      <div class="cell">
        <div class="picture-box" data-slot="2">
          <img src="./images/bonus.png" alt="Третий">
        </div>
        <div class="caption">Третий домик</div>
      </div>

      <div class="cell">
        <div class="picture-box" data-slot="3">
          <img src="./images/bonus.png" alt="Четвёртый">
        </div>
        <div class="caption">Четвёртый домик</div>
      </div>

    </div>
  </main>

  <script>
    const tg = window.Telegram?.WebApp;

    tg?.ready();
    tg?.expand();

    const buttons = [
      ...document.querySelectorAll(".fly-button")
    ];

    const slots = [
      ...document.querySelectorAll(".picture-box")
    ];

    const status = document.getElementById("status");

    let totalFlights = 0;

    buttons.forEach((button) => {
      button.addEventListener("click", () => {

        // Выбираем случайную картинку
        const randomIndex = Math.floor(
          Math.random() * slots.length
        );

        const target = slots[randomIndex];

        // Координаты кнопки и картинки
        const start = button.getBoundingClientRect();
        const end = target.getBoundingClientRect();

        // Создаём копию кнопки.
        // Оригинал остаётся на месте и работает.
        const flyer = button.cloneNode(true);

        flyer.classList.add("flying");
        flyer.setAttribute("aria-hidden", "true");
        flyer.tabIndex = -1;

        Object.assign(flyer.style, {
          left: start.left + "px",
          top: start.top + "px",
          width: start.width + "px",
          height: start.height + "px",
          opacity: "1"
        });

        document.body.appendChild(flyer);

        // Сначала фиксируем начальную позицию,
        // затем запускаем анимацию
        flyer.getBoundingClientRect();

        requestAnimationFrame(() => {
          const currentEnd = target.getBoundingClientRect();

          flyer.style.left =
            (currentEnd.left + currentEnd.width * 0.25) + "px";

          flyer.style.top =
            (currentEnd.top + currentEnd.height * 0.25) + "px";

          flyer.style.width =
            (currentEnd.width * 0.5) + "px";

          flyer.style.height =
            (currentEnd.height * 0.5) + "px";

          flyer.style.opacity = "0.25";
          flyer.style.borderRadius = "12px";
        });

        let finished = false;

        function finishFlight() {
          if (finished) return;
          finished = true;

          flyer.remove();

          totalFlights++;

          status.textContent =
            ``;

          tg?.HapticFeedback?.impactOccurred("light");
        }

        flyer.addEventListener("transitionend", (event) => {
          if (event.propertyName === "left") {
            finishFlight();
          }
        });

        // Защита от зависания анимации
        setTimeout(finishFlight, 800);
      });
    });
  </script>
</body>
</html>
